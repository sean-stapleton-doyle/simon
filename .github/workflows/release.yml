name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary
        run: |
          file build/simon
          otool -L build/simon
          strip -x build/simon

      - name: Package release archive
        run: |
          mkdir -p dist/pkg
          cp build/simon LICENSE README.md skills/simon/SKILL.md dist/pkg/
          tar -C dist/pkg -czf dist/simon-macos-arm64.tar.gz simon LICENSE README.md SKILL.md
          (cd dist && shasum -a 256 simon-macos-arm64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simon-macos-arm64
          path: |
            dist/simon-macos-arm64.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            dist/simon-macos-arm64.tar.gz
            dist/SHA256SUMS.txt
