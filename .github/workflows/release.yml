name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-macos-arm64:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Verify binary
        run: |
          file build/realmem
          otool -L build/realmem
          strip -x build/realmem

      - name: Package release archive
        run: |
          mkdir -p dist/pkg
          cp build/realmem LICENSE README.md dist/pkg/
          tar -C dist/pkg -czf dist/realmem-macos-arm64.tar.gz realmem LICENSE README.md
          (cd dist && shasum -a 256 realmem-macos-arm64.tar.gz > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: realmem-macos-arm64
          path: |
            dist/realmem-macos-arm64.tar.gz
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/realmem-macos-arm64.tar.gz
            dist/SHA256SUMS.txt
