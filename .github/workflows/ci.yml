name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "skills/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "skills/**"
      - "CMakeLists.txt"
      - "Makefile"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test binary
        run: |
          ./build/simon --help
          ./build/simon --skill | head -n 5
          ./build/simon -S --plain --no-config
          ./build/simon -S -o json --no-config
          ./build/simon 5 --plain --no-config
          ./build/simon -g 5 -o json --no-config
